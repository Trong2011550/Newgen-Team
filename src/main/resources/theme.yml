# ============================================================
#  NewGen Team - Theme
#  Đổi màu tại đây => toàn bộ plugin (message, title, actionbar,
#  GUI...) đổi theo. Dùng cú pháp MiniMessage:
#  https://docs.advntr.dev/minimessage/format.html
#  Ví dụ giá trị hợp lệ:
#    "<#ff5555>"                     - màu hex
#    "<red>"                          - màu đặt tên
#    "<gradient:#00D4FF:#0099FF>"     - gradient
#
#  Trong file ngôn ngữ (lang/*.yml) dùng token:
#    <primary> <secondary> <accent> <muted>
#    <danger> <success> <warning> <info>
#  LƯU Ý: token theme dùng như mã màu chuyển tiếp,
#  KHÔNG cần tag đóng (</primary>).
#
#  Palette hiện tại: "Economy Green" - xanh lá chủ đạo,
#  phong cách emerald/tiền tệ.
# ============================================================
theme:
  # Màu chữ chính (nội dung thông thường) - xanh lá tươi
  primary: "<#b7f0c0>"
  # Màu phụ (tiêu đề, nhấn mạnh nhẹ) - xanh emerald đậm
  secondary: "<#8fd6a0>"
  # Màu nổi bật (tên riêng, số liệu quan trọng) - xanh bạc hà sáng
  accent: "<#d9f7e0>"
  # Màu mờ (chú thích, thông tin phụ) - xanh xám dịu
  muted: "<#a3b8a9>"
  # Màu lỗi / hành động nguy hiểm
  danger: "<red>"
  # Màu thành công
  success: "<green>"
  # Màu cảnh báo
  warning: "<yellow>"
  # Màu thông tin
  info: "<aqua>"
