# ============================================================
#  NewGen Team - config.yml
#  File cấu hình gốc. Các cấu hình chức năng nằm ở file riêng:
#    settings.yml  - giới hạn team, lời mời, thống kê
#    levels.yml    - các cấp nâng cấp team (tier)
#    homes.yml     - dịch chuyển home team
#    chest.yml     - rương chung của team
#    database.yml  - kết nối cơ sở dữ liệu
#  Main configuration. Feature configs live in their own files
#  (settings.yml, levels.yml, homes.yml, chest.yml, database.yml).
# ============================================================

# Ngôn ngữ hiển thị. File tương ứng nằm trong lang/ (vi_VN, en_US).
# Key thiếu sẽ tự fallback sang en_US.
# Display language. Language files live in lang/. Missing keys fall back to en_US.
language: vi_VN
