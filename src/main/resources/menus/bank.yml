# Tiêu đề menu. Hỗ trợ MiniMessage + token theme (<primary>, <accent>...).
# Menu title. Supports MiniMessage + theme tokens (<primary>, <accent>...).
#title: "<primary>Ngân hàng team"

# Số hàng của menu (1-6). Mặc định: 6.
# Menu rows (1-6). Default: 6.
#rows: 6

# Mỗi item nhận: slot, material, glow, custom-model-data, enabled (xem menus/main.yml).
# Each item accepts: slot, material, glow, custom-model-data, enabled (see menus/main.yml).
items:
  team-balance:
    slot: 4
    material: GOLD_BLOCK
    glow: true
  your-balance:
    slot: 22
    material: SUNFLOWER
    glow: true
  deposit:
    slot: 38
    material: LIME_DYE
    glow: true
  withdraw:
    slot: 42
    material: RED_DYE
    glow: true
  withdraw-locked:
    slot: 42
    material: GRAY_DYE
  back:
    slot: 48
    material: ARROW
  close:
    slot: 50
    material: BARRIER
