# ============================================================
#  NewGen Team - menus/main.yml
#  Tùy chỉnh giao diện menu chính (/team).
#  Chỉ cần ghi đè những gì bạn muốn đổi - key nào thiếu sẽ dùng
#  giá trị mặc định của plugin. Text lấy từ lang/*.yml (gui.main.*).
#  Layout overrides for the main menu (/team).
#  Override only what you want to change - missing keys fall back
#  to the plugin defaults. All text comes from lang/*.yml (gui.main.*).
# ============================================================

# Tiêu đề menu. Hỗ trợ MiniMessage + token theme (<primary>, <accent>...).
# Menu title. Supports MiniMessage + theme tokens (<primary>, <accent>...).
#title: "<primary>NewGen Team"

# Số hàng của menu (1-6). Mặc định: 6.
# Menu rows (1-6). Default: 6.
#rows: 6

# Mỗi item nhận các key sau (tất cả đều tùy chọn):
#   slot               - vị trí ô (0 = trên-trái)
#   material           - tên Material của Minecraft (vd: NETHER_STAR)
#   glow               - true/false: hiệu ứng phát sáng
#   custom-model-data  - CustomModelData cho resource pack
#   enabled            - false: ẩn item này hoàn toàn
# Every item accepts these keys (all optional):
#   slot               - inventory slot (0 = top-left)
#   material           - Minecraft Material name (e.g. NETHER_STAR)
#   glow               - true/false: enchant glint
#   custom-model-data  - CustomModelData for resource packs
#   enabled            - false: hide this item entirely
