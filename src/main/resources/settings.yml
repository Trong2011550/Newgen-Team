# ============================================================
#  NewGen Team - settings.yml
#  Cấu hình chung về team: tên, tag, thành viên, lời mời, thống kê.
#  General team settings: name, tag, members, invites, stats.
# ============================================================

team:
  # Độ dài tối đa của tên team.
  # Maximum team name length.
  max-name-length: 16

  # Độ dài tối đa của tag team.
  # Maximum team tag length.
  max-tag-length: 6

  # Số thành viên cơ bản. Giới hạn thực tế do cấp team quyết định (levels.yml).
  # Base member cap. The effective limit is decided by the team level (levels.yml).
  max-members: 30

  # Thời gian (giây) lời mời / đơn xin gia nhập còn hiệu lực.
  # How long (seconds) an invite / join request stays valid.
  invite-ttl-seconds: 120

stats:
  # Có đếm kill/death của thành viên cho bảng xếp hạng hay không.
  # Whether to track member kills/deaths for leaderboards.
  track-kills: true

chat:
  # Định dạng tin nhắn chat team (mã màu legacy &). Placeholder: %tag%, %team%, %player%, %message%.
  # Team chat message format (legacy & color codes). Placeholders: %tag%, %team%, %player%, %message%.
  team-format: "&d[%tag%] &7%player%&8: &f%message%"

  # Ghi chat team ra console để staff giám sát.
  # Mirror team chat to the server console so staff can moderate it.
  log-to-console: true

gui:
  # Cách hiển thị ô nhập chữ (đặt tên, tag, số tiền, tìm kiếm...).
  # How text prompts (name, tag, amount, search...) are shown to players.
  #   AUTO    - Dialog gốc cho client >= 1.21.6, tự lùi về sign giả cho client cũ (KHUYẾN NGHỊ).
  #             Native dialog on 1.21.6+ clients, fake-sign fallback on older clients (RECOMMENDED).
  #   DIALOG  - Ép dùng dialog cho mọi người (client < 1.21.6 có thể không thấy ô nhập).
  #             Force dialogs for everyone (clients below 1.21.6 may not see the prompt).
  #   SIGN    - Luôn dùng sign giả, kể cả client mới. Hữu ích khi server không có Dialog API.
  #             Always use the fake-sign editor, even on new clients. Useful when the Dialog API is absent.
  input-method: AUTO
