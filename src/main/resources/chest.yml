# ============================================================
#  NewGen Team - chest.yml
#  Cấu hình rương chung của team.
#  Shared team chest settings.
#  Lưu ý: số trang rương theo cấp team nằm ở levels.yml.
#  Note: chest pages per team level are defined in levels.yml.
# ============================================================

chest:
  # Chu kỳ (giây) tự động lưu nội dung rương xuống database.
  # Interval (seconds) between automatic chest saves to the database.
  flush-interval-seconds: 300

  # Tiêu đề trang rương. Placeholder: %team%, %page%, %pages%.
  # Chest page title. Placeholders: %team%, %page%, %pages%.
  page-title: "&#8fd6a0&lRương Team &#d9f7e0- &#b7f0c0%team% &8(%page%/%pages%)"
