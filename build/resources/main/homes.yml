# ============================================================
#  NewGen Team - homes.yml
#  Cấu hình dịch chuyển về home của team.
#  Team home teleport settings.
# ============================================================

home:
  # Thời gian hồi (giây) giữa 2 lần dịch chuyển về home.
  # Cooldown (seconds) between two home teleports.
  teleport-cooldown-seconds: 5

  # Thời gian chờ (giây) trước khi dịch chuyển. 0 = tức thì.
  # Warmup (seconds) before teleporting. 0 = instant.
  teleport-warmup-seconds: 3

  # Hủy dịch chuyển nếu người chơi di chuyển trong lúc chờ.
  # Cancel the teleport if the player moves during warmup.
  warmup-cancel-on-move: true
