# ============================================================
#  NewGen Team - levels.yml
#  Các cấp nâng cấp team (tier). Mỗi cấp mở khóa thêm trang rương,
#  thành viên và home. Nâng cấp trả bằng PlayerPoints.
#  Team upgrade tiers. Each tier unlocks more chest pages,
#  members and homes. Upgrades are paid with PlayerPoints.
# ============================================================

# Mỗi cấp gồm:
#   pages        - số trang rương chung (mỗi trang 45 ô)
#   member-limit - số thành viên tối đa
#   home-limit   - số home tối đa
#   price        - giá nâng lên cấp này (cấp 1 luôn miễn phí)
# Each tier defines:
#   pages        - shared chest pages (45 slots per page)
#   member-limit - max members
#   home-limit   - max homes
#   price        - cost to upgrade INTO this tier (tier 1 is free)
tiers:
  1:
    pages: 1
    member-limit: 5
    home-limit: 1
    price: 0
  2:
    pages: 3
    member-limit: 8
    home-limit: 2
    price: 50000
  3:
    pages: 5
    member-limit: 12
    home-limit: 3
    price: 150000
  4:
    pages: 7
    member-limit: 20
    home-limit: 5
    price: 200000
